services:
  normal-backend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    entrypoint: ["/build/aegisgate_mock_backend"]
    command: ["18080", "--status", "200", "--max-inflight", "64"]
    networks:
      aegisgate-demo:
        ipv4_address: 172.29.0.10
    healthcheck:
      test: ["CMD-SHELL", "timeout 1 bash -c '</dev/tcp/127.0.0.1/18080'"]
      interval: 1s
      timeout: 1s
      retries: 10

  fault-backend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    entrypoint: ["/build/aegisgate_mock_backend"]
    command: ["18081", "--status", "503", "--max-inflight", "8"]
    networks:
      aegisgate-demo:
        ipv4_address: 172.29.0.11
    healthcheck:
      test: ["CMD-SHELL", "timeout 1 bash -c '</dev/tcp/127.0.0.1/18081'"]
      interval: 1s
      timeout: 1s
      retries: 10

  gateway:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    entrypoint: ["/build/aegisgate_server"]
    command: ["/etc/aegisgate/demo.yaml", "8080", "--log-path", "/var/log/aegisgate/aegisgate.jsonl"]
    depends_on:
      normal-backend:
        condition: service_healthy
      fault-backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "timeout 1 bash -c '</dev/tcp/127.0.0.1/8080'"]
      interval: 1s
      timeout: 1s
      retries: 10
    ports:
      - "8080:8080"
    volumes:
      # The verifier supplies an isolated writable copy through this bind mount;
      # ordinary `docker compose up` uses the checked-in demo configuration.
      - "${AEGISGATE_CONFIG_DIR:-../configs}:/etc/aegisgate:ro"
      - "${AEGISGATE_LOG_DIR:-../.demo-logs}:/var/log/aegisgate"
    networks:
      aegisgate-demo:
        ipv4_address: 172.29.0.20

networks:
  aegisgate-demo:
    ipam:
      config:
        - subnet: 172.29.0.0/24
